name: Test

# No paths-ignore: always triggers so required checks report a status.
# Docs-only changes are detected in-job and work is skipped (green). (#29)
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: v1.7.7

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: changes
        uses: HeaInSeo/platform-ci-actions/.github/actions/detect-docs-only@62c0d29be4f80824cb767bf184512ce9f624d2ff

      - name: Setup Go
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate GitHub Actions workflows
        if: steps.changes.outputs.docs_only != 'true'
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

  test:
    name: Unit And Regression Tests
    runs-on: ubuntu-latest
    # Disposable PostgreSQL Community 18.6 (TX1-CONFORMANCE) so the J2 adapter tests run
    # instead of skipping as NOT VERIFIED. Pinned by digest.
    services:
      postgres:
        image: postgres:18.6@sha256:0377e72c5289ed2f98cf61b1a9c2db9eb9d300317fe14244492fbc94343b3d04
        env:
          POSTGRES_PASSWORD: ah-ci
          POSTGRES_DB: ah_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ah_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      AH_TEST_POSTGRES_DSN: postgres://postgres:ah-ci@localhost:5432/ah_test?sslmode=disable
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: changes
        uses: HeaInSeo/platform-ci-actions/.github/actions/detect-docs-only@62c0d29be4f80824cb767bf184512ce9f624d2ff

      - name: Setup Go
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify go.mod and go.sum are tidy
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run tests
        if: steps.changes.outputs.docs_only != 'true'
        run: make test-race

      - name: Run regression suite
        if: steps.changes.outputs.docs_only != 'true'
        run: make test-regression-race

      - name: Run security lint guardrail
        if: steps.changes.outputs.docs_only != 'true'
        run: make lint-security-check

      - name: Run vulnerability guardrail
        if: steps.changes.outputs.docs_only != 'true'
        run: make vuln-check

      - name: Generate coverage report and enforce threshold
        if: steps.changes.outputs.docs_only != 'true'
        run: make coverage-check

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always() && steps.changes.outputs.docs_only != 'true'
        with:
          name: artifact-handoff-coverage
          path: reports/
