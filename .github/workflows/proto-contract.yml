name: Proto Contract

# No paths filter: the job context "Proto Contract" is a required status check,
# so it must report on every push and pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PROTOC_GEN_GO_VERSION: v1.36.11
  PROTOC_GEN_GO_GRPC_VERSION: v1.6.1

concurrency:
  group: proto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto-contract:
    name: Proto Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.54.0"

      - name: Install Go proto plugins
        run: |
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}"

      - name: Lint protobuf schema
        run: buf lint

      - name: Fetch base branch ref
        if: github.event_name == 'pull_request'
        run: git fetch origin main:refs/heads/main

      - name: Check breaking changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            buf breaking --against '.git#branch=main'
          else
            buf breaking --against '.git#ref=HEAD~1'
          fi

      - name: Self-test drift check scope
        run: bash scripts/proto-drift-check-test.sh

      - name: Regenerate and check for drift
        run: ./scripts/proto-drift-check.sh
